<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="nav"></div>

  <main class="container">
    <div class="page-header">
      <h1>My Profile</h1>
    </div>

    <div class="stack">
      <div class="card form-wide">
        <h2>Account Details</h2>
        <div id="profile-message"></div>

        <form id="profile-form" class="form">
          <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required minlength="2" />
          </div>
          <div class="field">
            <label for="email">Email <span id="role-badge" class="badge"></span></label>
            <input type="email" id="email" name="email" disabled />
            <div class="hint">Email can't be changed here.</div>
          </div>
          <button type="submit" class="btn">Save Changes</button>
        </form>
      </div>

      <div class="card form-wide">
        <h2>Change Password</h2>
        <div id="password-message"></div>

        <form id="change-password-form" class="form">
          <div class="field">
            <label for="old-password">Current Password</label>
            <input type="password" id="old-password" name="oldPassword" required autocomplete="current-password" />
          </div>
          <div class="field">
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" name="newPassword" required minlength="6" autocomplete="new-password" />
          </div>
          <div class="field">
            <label for="confirm-new-password">Confirm New Password</label>
            <input type="password" id="confirm-new-password" name="confirmNewPassword" required minlength="6" autocomplete="new-password" />
          </div>
          <button type="submit" class="btn">Change Password</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">Library Management System</footer>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
