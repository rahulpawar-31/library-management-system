<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="nav"></div>

  <main class="container">
    <div class="card card-narrow">
      <h1>Create Account</h1>
      <div id="form-message"></div>

      <form id="register-form" class="form">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required minlength="2" autocomplete="name" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password" />
          <div class="hint">At least 6 characters.</div>
        </div>
        <div class="field">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirmPassword" required minlength="6" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-block">Register</button>
      </form>

      <div class="form-footer">
        Already have an account? <a href="/login">Log in</a>
      </div>
    </div>
  </main>

  <footer class="footer">Library Management System</footer>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
