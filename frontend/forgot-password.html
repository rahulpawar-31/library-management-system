<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="nav"></div>

  <main class="container">
    <div class="card card-narrow">
      <h1>Reset Password</h1>
      <div id="form-message"></div>

      <form id="request-otp-form" class="form">
        <p class="field">Enter your account email and we'll send you a reset code.</p>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" />
        </div>
        <button type="submit" class="btn btn-block">Send Reset Code</button>
      </form>

      <form id="reset-password-form" class="form hidden">
        <p class="field">Enter the code sent to <strong id="sent-to"></strong> and choose a new password.</p>
        <input type="hidden" id="reset-email" />
        <div class="field">
          <label for="otp">Reset Code</label>
          <input type="text" id="otp" name="otp" required inputmode="numeric" autocomplete="one-time-code" />
        </div>
        <div class="field">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" name="newPassword" required minlength="6" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="confirm-new-password">Confirm New Password</label>
          <input type="password" id="confirm-new-password" name="confirmNewPassword" required minlength="6" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-block">Reset Password</button>
        <p class="form-footer"><a href="#" id="back-to-request">Use a different email</a></p>
      </form>

      <div class="form-footer">
        <a href="/login">Back to log in</a>
      </div>
    </div>
  </main>

  <footer class="footer">Library Management System</footer>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
