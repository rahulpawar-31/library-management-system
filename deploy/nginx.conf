# nginx site config for rahulcodes.qd.je
# Installed by deploy/bootstrap.sh into /etc/nginx/sites-available/.
# certbot rewrites this file in place to add the HTTPS server block on first run.

server {
    listen 80;
    listen [::]:80;
    server_name rahulcodes.qd.je;

    # "current" is a symlink to the active release, switched atomically by
    # deploy.sh — never points at a specific timestamped release directly.
    root /var/www/library-management-system-/current/frontend;
    index index.html;

    # API + auth routes
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Book cover images, served by Express's static middleware
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # Static frontend pages — extensionless URLs resolve to the matching
    # .html file (e.g. /login -> login.html), while the .html URL still
    # works too since $uri is tried first.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
